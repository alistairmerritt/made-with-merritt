<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>Second Chair slide</title>
<!-- Renders assets/second-chair-slide.jpg, the home page slideshow image (2000×1500):
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --force-device-scale-factor=1 \
       --virtual-time-budget=4000 --window-size=2000,1500 --screenshot=slide.png http://localhost:4174/second-chair/_docs/slide.html
     then: sips -s format jpeg -s formatOptions 88 slide.png --out ../../assets/second-chair-slide-mobile.jpg
     For desktop, add #desktop to the address, use --window-size=2400,1200 and save as second-chair-slide.jpg. -->
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/home.css">
<style>
  /* StandBy at night: the phone in the dark, its song's colour spilling around it. Kept in the middle third so the
     slideshow's crops (wide on desktop, tall on phones) both keep it, above the title at the bottom left. */
  html, body { margin: 0; width: 2000px; height: 1500px; overflow: hidden; background: #000; }
  .hero { position: relative; isolation: isolate; width: 2000px; height: 1500px; background: #000; overflow: hidden;
          --stage: #3f3a36; --wall-a: #6b4f38; --wall-b: #b59071; }   /* Rooftop Season: its stage at 28.6% for the night, its walls */
  .glow { position: absolute; left: 50%; top: 380px; width: 1300px; height: 640px; transform: translate(-50%, -50%);
          background: radial-gradient(closest-side, rgba(181, 144, 113, .30), rgba(107, 79, 56, .12) 55%, transparent);
          filter: blur(60px); z-index: -2; }
  /* The charging stand: rendered by devices/stand.py on black, added with screen so black adds nothing. */
  .stand { position: absolute; inset: 0; background: url("devices/stand-mobile.png") 0 0 / 100% 100% no-repeat; mix-blend-mode: screen; opacity: .7; z-index: -1; }
  .desktop .stand { background-image: url("devices/stand-desktop.png"); }
  .hero .hero-standby { position: absolute; left: 50%; top: 380px; width: 640px; transform: translate(-50%, -50%); right: auto; bottom: auto; margin: 0;
          --phone-drop: drop-shadow(0 3cqw 5cqw rgba(0, 0, 0, .85)) drop-shadow(0 .8cqw 1.4cqw rgba(0, 0, 0, .6)); }
  /* #desktop: the wider desktop crop (2400×1200), phone centred. */
  html.desktop, html.desktop body, .desktop .hero { width: 2400px; height: 1200px; }
  .desktop .glow { left: 1200px; top: 390px; width: 1700px; height: 800px; }
  .desktop .hero .hero-standby { left: 1200px; top: 390px; width: 880px; }
</style>
<script>if (location.hash === '#desktop') document.documentElement.classList.add('desktop');</script>
</head><body>

  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="3.6" width="4.6" height="16.8" rx="1.3"/><rect x="14.4" y="3.6" width="4.6" height="16.8" rx="1.3"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M1.6 6.5v11c0 .8.9 1.3 1.6.8L11.4 13v4.5c0 .8.9 1.3 1.6.8l8.6-5.5c.6-.4.6-1.3 0-1.6L13 5.7c-.7-.5-1.6 0-1.6.8V11L3.2 5.7c-.7-.5-1.6 0-1.6.8z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M22.4 6.5v11c0 .8-.9 1.3-1.6.8L12.6 13v4.5c0 .8-.9 1.3-1.6.8l-8.6-5.5c-.6-.4-.6-1.3 0-1.6L11 5.7c.7-.5 1.6 0 1.6.8V11l8.2-5.3c.7-.5 1.6 0 1.6.8z"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M12.6 3.2c0-.6.5-1 1.1-.9l.3.1c.4 1.9 1.6 3.1 3 4.2 1.5 1.2 2.6 2.6 2.4 4.9-.1 1-.5 2-1 2.8-.2.3-.6.1-.5-.2.3-.8.5-1.6.4-2.5-.2-1.9-1.9-3.2-4.1-3.9v9.5c0 2.3-2.1 4.1-4.7 4.1-1.9 0-3.1-1-3.1-2.4 0-2.1 2.3-3.8 5-3.8.5 0 1 .1 1.2.2z"/></symbol>

  <symbol id="i-iphone-arrow" viewBox="0 0 24 24"><path d="M5.6 2h4.8C11.8 2 13 3.2 13 4.6v14.8c0 1.4-1.2 2.6-2.6 2.6H5.6C4.2 22 3 20.8 3 19.4V4.6C3 3.2 4.2 2 5.6 2zm0 1.6c-.6 0-1 .4-1 1v14.8c0 .6.4 1 1 1h4.8c.6 0 1-.4 1-1V4.6c0-.6-.4-1-1-1z"/><path d="M15.4 12h6m0 0-2.7-2.7m2.7 2.7-2.7 2.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-iphone" viewBox="0 0 24 24"><path d="M8.6 2h6.8c1.4 0 2.4 1 2.4 2.4v15.2c0 1.4-1 2.4-2.4 2.4H8.6c-1.4 0-2.4-1-2.4-2.4V4.4C6.2 3 7.2 2 8.6 2zm0 1.6c-.5 0-.8.3-.8.8v15.2c0 .5.3.8.8.8h6.8c.5 0 .8-.3.8-.8V4.4c0-.5-.3-.8-.8-.8h-1.2c0 .5-.3.8-.8.8h-2.4c-.5 0-.8-.3-.8-.8z"/></symbol>
</svg>
<div class="hero"><div class="glow"></div><div class="stand"></div>
<!-- The iPhone, in StandBy -->
        <div class="phone phone--landscape hero-phone hero-standby" data-surface="iphone">
          
          <div class="phone-body"><div class="phone-bezel"><div class="screen">
            <span class="island" aria-hidden="true"></span>
            <!-- StandBy's Now Playing, laid out as iOS draws it: artwork left; title, artist, controls and scrubber centred on the right. -->
            <div class="standby-ui">
              <div class="wall" aria-hidden="true"></div>
              <div class="sb-art" data-swap="spin"><img class="art" data-bind="art" src="../assets/art/rooftop-season.webp" alt="" width="300" height="300"></div>
              <div class="sb-side">
                <div class="sb-top" aria-hidden="true"><svg><use href="#i-vol-mid"/></svg><svg><use href="#i-airplay-audio"/></svg></div>
                <div class="sb-meta"><b class="sb-title" data-bind="title">Rooftop Season</b><span class="sb-artist" data-bind="artist">Tavi Rhodes</span></div>
                <div class="sb-controls">
                  <button type="button" class="ios-btn" data-cmd="previous" aria-label="Previous, from the iPhone"><svg class="glyph-fill"><use href="#i-prev"/></svg></button>
                  <button type="button" class="ios-btn pp" data-cmd="toggle" data-where="from the iPhone" aria-label="Pause from the iPhone"><svg class="i-pause glyph-fill"><use href="#i-pause"/></svg><svg class="i-play glyph-fill"><use href="#i-play"/></svg></button>
                  <button type="button" class="ios-btn" data-cmd="next" aria-label="Next, from the iPhone"><svg class="glyph-fill"><use href="#i-next"/></svg></button>
                </div>
                <div class="sb-scrub" aria-hidden="true"><div class="ios-bar"><i data-bind="progress" style="--p:.596"></i></div><div class="sb-times"><span data-bind="elapsed">1:52</span><span data-bind="remaining">−1:16</span></div></div>
              </div>
              <span class="sb-home" aria-hidden="true"></span>
            </div>
          </div></div></div>
        </div>

      
</div>
</body></html>
